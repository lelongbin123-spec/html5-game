<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học & Chơi - Game Hub</title>
    <style>
        :root { --primary: #6366f1; --voca: #10b981; --fun: #f59e0b; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #f8fafc; margin: 0; padding: 40px 20px; text-align: center; }
        .container { max-width: 1000px; margin: auto; }
        .header { margin-bottom: 50px; }
        .header h1 { font-size: 2.5rem; color: var(--primary); margin: 0; }
        .section-title { text-align: left; font-size: 1.5rem; margin: 30px 0 20px; padding-left: 15px; border-left: 4px solid var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid #334155; border-radius: 15px; padding: 25px; text-decoration: none; color: white; transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .badge { font-size: 0.7rem; font-weight: bold; padding: 4px 10px; border-radius: 10px; position: absolute; top: 15px; right: 15px; }
        .badge-voca { background: rgba(16, 185, 129, 0.2); color: var(--voca); }
        .badge-fun { background: rgba(245, 158, 11, 0.2); color: var(--fun); }
        .card h3 { margin-top: 20px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 GAME HUB</h1>
            <p>Khám phá thế giới từ vựng và những trò chơi thú vị</p>
        </div>

        <div class="section-title">Học Từ Vựng (Vocabulary Games)</div>
        <div class="grid">
            <a href="Game-Voca-Aa/index.html" class="card">
                <span class="badge badge-voca">VOCA</span>
                <h3>🔤 Voca Game 01</h3>
            </a>
            <a href="Game-Voca-AaAnt/index.html" class="card">
                <span class="badge badge-voca">VOCA</span>
            </a>
            <a href="Game-Voca-Bb/index.html" class="card">
                <span class="badge badge-voca">VOCA</span>
                <h3>🧠 Voca Game 03</h3>
            </a>
            <a href="Game-Voca-AntBoy/index.html" class="card">
                <span class="badge badge-voca">VOCA</span>
                <h3>📝 Voca Game 04</h3>
            </a>
        </div>

        <div class="section-title">Giải Trí & Kỹ Năng</div>
        <div class="grid">
            <a href="Bus-to-shool/index.html" class="card">
                <span class="badge badge-fun">FUN</span>
                <h3>🚌 Bus To School</h3>
            </a>
            <a href="Skill-time/index.html" class="card">
                <span class="badge badge-fun">SKILL</span>
                <h3>⏳ Skill Time</h3>
            </a>
        </div>
    </div>
</body>
</html>
